name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, Vitest and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and test
        run: npm run check
      - name: Build the production PWA
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Playwright and headless Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps --only-shell chromium
      - name: Check the restored reading location
        run: python -u scripts/check_restore_locator.py dist
      - name: Replay backup export regressions
        run: |
          python -u scripts/replay-backup-browser.py export-snapshot
          python -u scripts/replay-backup-browser.py backup-limits
      - name: Check out the PR base for the rollback test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline-pwa
          persist-credentials: false
      - name: Build the previous PWA
        working-directory: baseline-pwa
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Check upgrade and rollback with an existing v2 library
        run: python -u scripts/check_release_cycle.py dist baseline-pwa/dist
      - name: Observe an old reader suspended across a library restore
        run: python -u scripts/check_frozen_reader.py dist baseline-pwa/dist
